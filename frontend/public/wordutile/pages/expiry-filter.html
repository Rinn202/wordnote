<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만료 약품 필터</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../styles/expiry-filter.css">
</head>

<body>

  <div style="padding:1.5rem 0;">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:0.25rem;">
      <i class="ti ti-pill" style="font-size:22px; color:var(--color-text-secondary)"></i>
      <span style="font-size:18px; font-weight:500;">만료 약품 필터</span>
    </div>
    <p style="font-size:14px; color:var(--color-text-secondary); margin:0 0 1.5rem;">확인할 날짜를 선택하면 그 날짜에 처방이 끊기는 약을 찾습니다
    </p>

    <span class="slabel">확인할 날짜 선택 <span style="font-weight:400;">(오늘 나이트 → 내일 최소 선택)</span></span>
    <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:1.25rem;">
      <button class="nav-btn" onclick="shiftWindow(-1)" aria-label="이전">
        <i class="ti ti-chevron-left"></i>
      </button>
      <div style="display:flex; gap:6px;" id="day-buttons"></div>
      <button class="nav-btn" onclick="shiftWindow(1)" aria-label="다음">
        <i class="ti ti-chevron-right"></i>
      </button>
    </div>

    <div class="info-box">
      <i class="ti ti-info-circle" style="font-size:15px; vertical-align:-2px; margin-right:5px"></i>
      <span id="logic-text">날짜를 선택해주세요</span>
    </div>

    <div id="upload-area"
      style="border:1.5px dashed var(--color-border-secondary); border-radius:var(--border-radius-lg); padding:2rem; text-align:center; cursor:pointer; margin-bottom:1.5rem;"
      onclick="document.getElementById('file-in').click()"
      ondragover="event.preventDefault(); this.style.background='var(--color-background-secondary)'"
      ondragleave="this.style.background=''" ondrop="handleDrop(event)">
      <i class="ti ti-upload" style="font-size:28px; color:var(--color-text-secondary)"></i>
      <p style="margin:8px 0 0; font-size:14px; color:var(--color-text-secondary);">클릭하거나 파일을 드래그</p>
      <p style="margin:4px 0 0; font-size:12px; color:var(--color-text-tertiary);">.xlsx, .xlsm</p>
      <input type="file" id="file-in" accept=".xlsx,.xlsm" style="display:none" onchange="handleFile(this.files[0])">
    </div>

    <div id="status"
      style="display:none; font-size:13px; padding:10px 14px; border-radius:var(--border-radius-md); margin-bottom:1rem;">
    </div>

    <div id="result-section" style="display:none;">
      <div
        style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:8px;">
        <span style="font-size:14px; font-weight:500;" id="result-title">추출 결과</span>
        <button onclick="downloadResult()" style="font-size:13px; padding:6px 16px;">
          <i class="ti ti-download" style="font-size:15px; vertical-align:-2px; margin-right:4px"></i>엑셀 다운로드
        </button>
      </div>
      <div style="overflow-x:auto;">
        <table id="result-table"></table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../script/ExpiryFilter.js"></script>
</body>

</html>
