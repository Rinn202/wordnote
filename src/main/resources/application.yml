spring:
  datasource:
    url: ${MYSQL_PUBLIC_URL}
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true #초기 파일(data.sql) 추가시 사용
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${G_CLIENT_ID}
            client-secret: ${G_CLIENT_SECRET}
            redirect-uri: "${OAUTH_REDIRECT_URI}"
            scope:
              - email
              - profile
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 30
  refresh-token-expiration-minutes: 420 # 7시간

logging:
  level:
    org:
      springframework:
        orm:
          jpa: ERROR  # DEBUG → ERROR
    root: WARN
server:
  port: ${PORT:8080}