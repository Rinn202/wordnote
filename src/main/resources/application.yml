  datasource:
    url: jdbc:h2:mem:testdb # H2 인메모리 DB URL
    driver-class-name: org.h2.Driver # H2 드라이버
    username: sa # DB 사용자명
    password: # DB 비밀번호

  h2:
    console:
      enabled: true # H2 콘솔 활성화
      path: /h2-console # 접속 경로 (http://localhost:8080/h2-console)

  jpa:
    hibernate:
      ddl-auto: create # 엔티티 기준으로 테이블 자동 생성/수정
    show-sql: true # 실행되는 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true

    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect # JPA SQL -> H2용으로 번역
